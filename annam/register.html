<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Join ANNAM Food Rescue</title>
  <meta name="description" content="Register as a food donor, volunteer courier, or recipient shelter on ANNAM." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background: linear-gradient(135deg, #F8FAF5 0%, #EBF6EE 100%);">

  <main style="min-height: calc(100vh - 40px); display: flex; align-items: center; justify-content: center; padding: 32px 24px;">
    <div class="card" style="max-width: 560px; width: 100%; padding: 40px; box-shadow: var(--shadow-lg);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="index.html" style="display:inline-flex; align-items:center; gap: 8px; margin-bottom: 12px;">
          <svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" fill="#EBF6EE" stroke="#228B45" stroke-width="3"/>
            <path d="M22 64C22 64 34 76 50 76C66 76 78 64 78 64" stroke="#228B45" stroke-width="4" stroke-linecap="round"/>
            <path d="M28 50C28 62 72 62 72 50C72 48 28 48 28 50Z" fill="#FF9F32"/>
            <path d="M50 22C44 28 42 36 50 42C58 36 56 28 50 22Z" fill="#228B45"/>
          </svg>
          <span style="font-size: 1.625rem; font-weight: 800; color: var(--primary); letter-spacing:-0.02em;">ANNAM</span>
        </a>
        <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px;">Join the Food Rescue Mission</h2>
        <p style="font-size: 0.875rem; color: var(--text-muted);">Choose your role and help deliver dignity and meals</p>
      </div>

      <form id="register-form">
        <div id="reg-error" style="display:none; background:#FEE2E2; border:1px solid #F87171; color:#991B1B; padding:10px 14px; border-radius:var(--radius-sm); font-size:0.8125rem; margin-bottom:16px;"></div>

        <div class="form-group">
          <label class="form-label" for="reg-role">I Want to Join As *</label>
          <select id="reg-role" class="form-select" required>
            <option value="Food Donor">👨‍🍳 Food Donor (Marriage Hall, Restaurant, Hotel, Caterer)</option>
            <option value="Volunteer">🚴 Volunteer Courier (Pickup, Inspect & Deliver)</option>
            <option value="NGO / Recipient">🏢 NGO / Shelter / Orphanage (Receive Meals)</option>
          </select>
          <div class="form-help">Your selected role unlocks tailored dashboard tools and permissions.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name or Organization Name *</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Royal Palace Banquets or Priya Sundar" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-input" placeholder="name@domain.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number *</label>
            <input type="tel" id="reg-phone" class="form-input" placeholder="+91 98400 12345" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-location">City & Full Address *</label>
          <input type="text" id="reg-location" class="form-input" placeholder="e.g. 15, Mount Road, T. Nagar, Chennai" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password *</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Create a secure password" required />
          <div class="form-help">Prototype storage: credentials stored locally in your browser.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px; justify-content:center;">
          Create Partner Account ➔
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 20px;">
        Already registered? <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign In</a>
      </div>

      <div style="margin-top: 12px; text-align: center;">
        <a href="index.html" style="font-size: 0.8125rem; color: var(--text-light);">← Back to Homepage</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
